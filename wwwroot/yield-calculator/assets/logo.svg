<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1024" width="2048" height="1024" role="img" aria-label="Oxyniti — Nano-Bubble Aeration">
  <defs>
    <linearGradient id="niti" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#14d8c4"/>
      <stop offset="1" stop-color="#5ce1ff"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Sora:wght@700;800&amp;display=swap');
      .word { font: 800 285px 'Sora', 'Segoe UI', sans-serif; letter-spacing: 3px; }
      .tag  { font: 700 55px  'Sora', 'Segoe UI', sans-serif; letter-spacing: 23px; }
    </style>
  </defs>

  <!-- bubble-swirl mark (scaled: 520px box at x=190 y=252) -->
  <g transform="translate(190,252) scale(8.125)">
    <circle cx="35.8" cy="10.3" r="2.0" fill="#12B8A6"/>
    <circle cx="24.5" cy="11.3" r="2.4" fill="#13BFAD"/>
    <circle cx="15.1" cy="17.9" r="2.8" fill="#15C6B4"/>
    <circle cx="10.3" cy="28.2" r="3.2" fill="#16CDBB"/>
    <circle cx="11.3" cy="39.5" r="3.6" fill="#18D3C2"/>
    <circle cx="17.9" cy="48.9" r="4.0" fill="#1AD9C9"/>
    <circle cx="28.2" cy="53.7" r="4.4" fill="#2BDCD3"/>
    <circle cx="39.5" cy="52.7" r="4.8" fill="#3CDFE0"/>
    <circle cx="48.9" cy="46.1" r="5.2" fill="#46E0EA"/>
    <circle cx="53.7" cy="35.8" r="5.6" fill="#50E1F4"/>
    <circle cx="52.7" cy="24.5" r="6.0" fill="#5CE1FF"/>
    <circle cx="47.0" cy="14.0" r="2.6" fill="#FFB03A"/>
    <circle cx="51.5" cy="8.5" r="1.8" fill="#FF9E45"/>
    <circle cx="55.0" cy="4.0" r="1.2" fill="#FF8A50"/>
  </g>

  <!-- wordmark -->
  <text class="word" x="780" y="560" fill="#073B43">oxy<tspan fill="url(#niti)">niti</tspan></text>
  <text class="tag"  x="790" y="700" fill="#0A6A73">NANO-BUBBLE AERATION</text>
</svg>
