name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_publish:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Publish
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Enforce wwwroot/images size budget
        run: |
          set -e
          MAX_FILE_BYTES=512000
          MAX_TOTAL_BYTES=5242880
          DIR=wwwroot/images
          fail=0
          total=0
          while IFS= read -r -d '' f; do
            size=$(stat -c%s "$f")
            total=$((total + size))
            if [ "$size" -gt "$MAX_FILE_BYTES" ]; then
              echo "::error file=$f::$f is $size bytes, exceeds the 500 KB per-file budget"
              fail=1
            fi
          done < <(find "$DIR" -type f -print0)
          echo "Total size of $DIR: $total bytes (budget: $MAX_TOTAL_BYTES bytes)"
          if [ "$total" -gt "$MAX_TOTAL_BYTES" ]; then
            echo "::error::$DIR total is $total bytes, exceeds the 5 MB budget"
            fail=1
          fi
          exit $fail

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish -c Release -o ./bin/Release/publish

      # Issue #65: /product/{slug} shipped nothing but a loading skeleton
      # until the Blazor runtime booted and called MakerClient -- no name,
      # price, spec or image in the HTML, and no product URL in sitemap.xml.
      # This pulls the live catalogue and writes a real
      # product/{slug}/index.html straight into the publish output, plus the
      # matching sitemap.xml entries. Static Web Apps serves a matching file
      # before it ever falls back to index.html, so these are what a crawler
      # (or a browser with JS disabled) sees; the Blazor app then mounts over
      # the same #app root and hydrates the live, interactive page on top,
      # same as the homepage's existing static shell.
      - name: Generate static product pages + sitemap entries
        run: dotnet run --project tools/StaticProductPages/StaticProductPages.csproj -c Release -- --wwwroot bin/Release/publish/wwwroot

      # Same idea as the wwwroot/images budget above, for the .NET payload. The
      # ceiling is ~3% over the size achieved by #35, so a regression fails the
      # build rather than quietly costing every first-time visitor.
      #
      # Brotli only: Static Web Apps serves .br, and measuring decoded bytes is
      # what produced the inflated savings estimates on #35 in the first place.
      #
      # This counts everything on disk (all three ICU shards, both fingerprinted
      # copies), which is larger than what any one visitor downloads (~2.7 MB).
      # It is a regression tripwire, not a model of the user experience.
      #
      # Calibrated against THIS job, not a local build: SDK 9.0.x here produces
      # 3,306,399 bytes where SDK 10.0.204 locally produces 3,256,929, and the
      # budget has to clear the number the gate actually measures. ~3% headroom.
      - name: Enforce _framework payload budget
        run: |
          set -e
          MAX_TOTAL_BYTES=3405591
          DIR=bin/Release/publish/wwwroot/_framework
          total=0
          count=0
          while IFS= read -r -d '' f; do
            total=$((total + $(stat -c%s "$f")))
            count=$((count + 1))
          done < <(find "$DIR" -type f -name '*.br' -print0)
          echo "$DIR: $count brotli files, $total bytes (budget: $MAX_TOTAL_BYTES bytes)"
          if [ "$total" -gt "$MAX_TOTAL_BYTES" ]; then
            echo "::error::$DIR is $total bytes, over the $MAX_TOTAL_BYTES byte budget."
            echo "::error::Every byte here is on the critical path before first paint. See issue #35."
            exit 1
          fi

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_OXINITI }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/bin/Release/publish/wwwroot"
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_OXINITI }}
          app_location: "/bin/Release/publish/wwwroot"
          action: "close"
